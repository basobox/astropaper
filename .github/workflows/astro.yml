name: Deploy ke GitHub Pages

on:
  push:
    branches: [ main, master ] # Mendukung branch main atau master otomatis

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Memperbarui versi ke Node 24 sesuai standar terbaru
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Menggunakan perintah instalasi bersih (Clean Install) untuk CI/CD

      - name: Build Astro Static Site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Menunjuk folder hasil kompilasi standar Astro
